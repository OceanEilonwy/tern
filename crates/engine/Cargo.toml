[package]
name = "tern-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# What every Tern does, with no toolkit in it: writing mail, reading its HTML, fetching ahead, the
# rules, the settings and search by meaning. The GTK app and the Android app both stand on this.
[dependencies]
tern-core = { workspace = true }
tern-tuta = { workspace = true }
tern-cache = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "=1.1.8"
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "sync", "macros"] }
scraper = { version = "0.29", default-features = false }
ego-tree = "0.11"
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
async-trait = "0.1.77"
