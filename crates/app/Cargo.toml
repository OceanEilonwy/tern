[package]
name = "tern-app"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The one core: the app's state, navigation and what each action does. A platform draws what this
# publishes and sends back what the person did. The bridge for other languages is behind `uniffi`.
[features]
uniffi = ["dep:uniffi"]

[dependencies]
tern-mail = { workspace = true }
tern-rules = { workspace = true }
tern-html = { workspace = true }
tern-compose = { workspace = true }
tern-demo = { workspace = true }
tern-tuta = { workspace = true }
tern-cache = { workspace = true }
tern-sync = { workspace = true }
serde = { workspace = true }
log = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
base64 = { workspace = true }
libc = "0.2"
async-trait = "0.1.77"
uniffi = { workspace = true, optional = true }
thiserror = "2.0"
toml = "=1.1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
