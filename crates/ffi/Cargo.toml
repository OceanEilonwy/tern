[package]
name = "tern-ffi"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]
name = "tern_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
tern-app = { workspace = true, features = ["uniffi"] }
uniffi = { workspace = true, features = ["cli"] }
