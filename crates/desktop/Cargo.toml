[package]
name = "tern"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
tern-mail = { workspace = true }
tern-rules = { workspace = true }
tern-compose = { workspace = true }
tern-demo = { workspace = true }
tern-cache = { workspace = true }
tern-app = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
toml = "=1.1.8"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "sync", "macros"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
async-trait = "0.1.77"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
relm4 = { version = "0.11", features = ["libadwaita"] }

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
