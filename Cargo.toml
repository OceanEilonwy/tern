[workspace]
resolver = "2"
members = [
    "crates/mail",
    "crates/rules",
    "crates/html",
    "crates/compose",
    "crates/demo",
    "crates/tuta",
    "crates/cache",
    "crates/sync",
    "crates/app",
    "crates/ffi",
    "crates/desktop",
    "vendor/tuta-sdk/sdk",
    "vendor/tuta-sdk/crypto-primitives",
    "vendor/tuta-sdk/util",
]
default-members = ["crates/desktop"]

[workspace.package]
version = "365.261029.1"
rust-version = "1.84.0"
edition = "2021"
homepage = "https://tutao.de"
repository = "https://github.com/tutao/tutanota"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
tuta-sdk = { path = "vendor/tuta-sdk/sdk", default-features = false }
crypto-primitives = { path = "vendor/tuta-sdk/crypto-primitives", default-features = false }
util = { path = "vendor/tuta-sdk/util", default-features = false }
tern-mail = { path = "crates/mail" }
tern-rules = { path = "crates/rules" }
tern-html = { path = "crates/html" }
tern-compose = { path = "crates/compose" }
tern-demo = { path = "crates/demo" }
tern-tuta = { path = "crates/tuta" }
tern-cache = { path = "crates/cache" }
tern-sync = { path = "crates/sync" }
tern-app = { path = "crates/app" }
base64 = { version = "0.22.1" }
log = { version = "0.4.22" }
serde = { version = "1.0.210", features = ["derive", "rc"] }
serde_json = { version = "1.0.117" }
tokio = { version = "1.43", default-features = false }
uniffi = { git = "https://github.com/mozilla/uniffi-rs.git", rev = "13a1c559cb3708eeca40dcf95dc8b3ccccf3b88c", default-features = false }
rand = { version = "0.8" }

# Only the vendored Tuta SDK crates use this table, and clippy is off for them: the code stays as
# Tuta wrote it so new releases vendor cleanly. Tern's own crates keep clippy's defaults.
[workspace.lints.clippy]
all = { level = "allow", priority = -1 }

# The Android library: small and fast. Symbols stay for the bindings, which are read from them;
# the Android build strips them when it packages the library.
[profile.mobile]
inherits = "release"
lto = "thin"
codegen-units = 4
strip = "debuginfo"
