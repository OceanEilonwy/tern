name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Validates the wrapper jar and caches Gradle's dependencies and build cache.
      - uses: gradle/actions/setup-gradle@v6
      # Tern compiles against Android 17 (API 37.2).
      - name: Install Android SDK platform and NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "ndk;30.0.14904198" > /dev/null
      # The app builds its core (crates/app, loaded as crates/ffi) from Rust for each ABI.
      - name: Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: tern-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
