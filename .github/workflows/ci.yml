# Checks every push and pull request: clippy, the unit tests and the window scenes (on a virtual
# kwin_wayland display, as when run locally; Broadway lays out panes differently). Runs on Arch, which has the GTK 4.22 and libadwaita 1.9 Tern needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita openssl dbus rustup \
            cantarell-fonts noto-fonts adwaita-icon-theme kwin
          rustup default stable
          rustup component add clippy
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Window scenes
        env:
          XDG_RUNTIME_DIR: /tmp/runtime
        # kwin_wayland carries a file capability that an unprivileged container refuses to run.
        run: |
          setcap -r /usr/bin/kwin_wayland
          mkdir -p -m 700 /tmp/runtime
          make test-ui
