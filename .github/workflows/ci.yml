# Checks every push and pull request: clippy, the unit tests and the window scenes (on GNOME's
# headless mutter). Runs on Arch, which has the GTK 4.22 and libadwaita 1.9 Tern needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita openssl dbus rustup \
            cantarell-fonts noto-fonts adwaita-icon-theme mutter
          rustup default stable
          rustup component add clippy
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Clippy is off for the vendored Tuta SDK (see Cargo.toml); this checks Tern's own crates.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --locked
      # GNOME's mutter, headless, drawn in software: the runner has no GPU.
      - name: Window scenes
        env:
          XDG_RUNTIME_DIR: /tmp/runtime
          GSK_RENDERER: cairo
        run: |
          mkdir -p -m 700 /tmp/runtime
          dbus-run-session -- make test-ui
